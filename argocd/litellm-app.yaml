apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yvestchaledevops/socle-iag-gitops.git
    targetRevision: main
    path: charts/litellm-helm
    helm:
      valueFiles:
        - ../../apps/litellm/values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: iag-socle-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
