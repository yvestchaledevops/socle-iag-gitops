replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

image:
  repository: ghcr.io/berriai/litellm-database
  tag: main-stable
  pullPolicy: IfNotPresent

masterkeySecretName: litellm-masterkey
masterkeySecretKey: masterkey

environmentSecrets:
  - aws-creds

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

db:
  deployStandalone: true
  useExisting: false

redis:
  enabled: true

proxy_config:
  model_list:
    - model_name: chat-eco
      litellm_params:
        model: bedrock/eu.anthropic.claude-3-haiku-20240307-v1:0
        aws_region_name: eu-west-3
    - model_name: chat-puissant
      litellm_params:
        model: bedrock/eu.anthropic.claude-opus-4-6-v1
        aws_region_name: eu-west-3
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
